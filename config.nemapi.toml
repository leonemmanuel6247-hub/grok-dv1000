# Config « pont Firefox » (NemApi / bridge) pour grok-build — dv1000 i686.
#
# Installation : ./scripts/apply-nemapi-config.sh
#   -> écrit ~/.grok/config.toml ET ~/.grok/rules/grok-bridge-system.md
#
# UNE SEULE CLE : NEMAPI_API_KEY (locale, factice "local" suffit si le pont
# n'exige pas de protection ; la mettre en dur ici n'est jamais nécessaire).
#
# Le CLI parle au pont sur 127.0.0.1:8090 (OpenAI-compatible) qui route vers
# l'onglet du fournisseur via l'extension Firefox. AUCUNE requête ne part
# vers xAI si ces endpoints restent à 127.0.0.1:8090.

[models]
default            = "deepseek-chat"   # onglet ouvert par défaut
web_search         = "deepseek-chat"   # pas de service xAI
image_description  = "deepseek-chat"
session_summary    = "deepseek-chat"
allowed_models     = []                # aucune restriction de catalogue
agent_type         = "grok-build"      # pas d'agent xAI
inference_idle_timeout_secs = 86400    # 24 h — générations longues via le pont (défaut binaire relevé aussi)

[endpoints]   # TOUS vers le pont : sinon le CLI contacte xAI
cli_chat_proxy_base_url = "http://127.0.0.1:8090/v1"
xai_api_base_url        = "http://127.0.0.1:8090/v1"
models_base_url         = "http://127.0.0.1:8090/v1"
models_list_url         = "http://127.0.0.1:8090/v1/models"

[auth]
preferred_method     = "api_key"   # évite le login navigateur
disable_api_key_auth = false       # le pont ne bloque pas la clé

[features]
telemetry                = false   # aucune télémétrie xAI
remote_fetch             = false   # aucun catalogue distant (sinon il écrase [model.*])
write_file               = true
subagent_model_inheritance = true   # pas de sous-agent dédié

# ---------------------------------------------------------------------------
# Un [model.<id>] PAR onglet fournisseur.
# Déclaré ici => valide pour le CLI même absent du catalogue compilé.
# (Le catalogue résolu priorise : config.toml [model.*] > prefetched > binaire.)
# ---------------------------------------------------------------------------

[model.deepseek-chat]
model                    = "deepseek-chat"
model_family             = "deepseek"
name                     = "DeepSeek Chat"
description              = "DeepSeek via pont Firefox (onglet chat.deepseek.com)"
api_backend              = "chat_completions"
base_url                 = "http://127.0.0.1:8090/v1"
env_key                  = "NEMAPI_API_KEY"
context_window           = 200000
max_completion_tokens    = 8192
supports_backend_search   = false
supports_reasoning_effort = false
system_prompt_label      = "grok-build"
temperature              = 0.7

